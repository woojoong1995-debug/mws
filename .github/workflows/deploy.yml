name: 자동 배포

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 서버에 SSH 접속해서 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 223.130.138.146
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/mws
            git fetch origin main
            git checkout origin/main -- frontend/index.html rontend/a-logo.jpeg frontend/b-logo.jpeg backend/main.py backend/inbound.py backend/outbound.py backend/returns.py backend/inventory.py backend/auth.py backend/users.py backend/user_db.py backend/database.py backend/ocr.py
            systemctl restart warehouse
