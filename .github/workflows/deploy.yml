name: 자동 배포

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 서버에 SSH 접속해서 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 223.130.138.146
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/mws
            git fetch origin main
            git checkout origin/main -- \
              frontend/index.html \
              frontend/a-logo.png \
              frontend/b-logo.png \
              frontend/css/style.css \
              frontend/js/app.js \
              frontend/js/inbound.js \
              frontend/js/outbound.js \
              frontend/js/returns.js \
              frontend/js/inventory.js \
              frontend/js/history.js \
              frontend/js/admin.js \
              frontend/js/edit.js \
              frontend/js/ocr.js \
              backend/main.py \
              backend/auth.py \
              backend/users.py \
              backend/inbound.py \
              backend/outbound.py \
              backend/returns.py \
              backend/inventory.py \
              backend/database.py \
              backend/user_db.py \
              backend/ocr.py
            systemctl restart warehouse